name: Insuretech Connect
description: 'InsureTech Connect (ITC) is the world''s largest insurance innovation
  event series, produced by Clarion Events. Its flagship, ITC Vegas, brings together
  9,000+ insurance carriers, insurtech startups, brokers, reinsurers, and investors
  for three days of content, networking, and dealmaking, with regional editions in
  Europe and Asia. Surfaced as a portfolio company of qed-investors and added to the
  API Evangelist network. ITC is an events and media brand; as of this profile it
  does not publish a public developer API, OpenAPI, SDKs, or event webhooks, so this
  entry carries company identity and probed domain-security signals only.'
